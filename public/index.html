<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>星芒 AI · 日常聊天</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='2' y1='2' x2='22' y2='22' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23818CF8'/%3E%3Cstop offset='1' stop-color='%2338BDF8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M12 1.5L14.45 9.55L22.5 12L14.45 14.45L12 22.5L9.55 14.45L1.5 12L9.55 9.55L12 1.5Z' fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>

  <!-- 一人一密登录门禁视图 -->
  <main id="auth-view" class="auth-view hidden">
    <section class="glass-card auth-card">
      <div class="auth-header">
        <div class="welcome-badge auth-badge">
          <span class="starburst-icon"></span>
        </div>
        <h1 class="auth-title">星芒 AI</h1>
        <p class="auth-subtitle">输入专属访问密码，加载你的云端日常对话</p>
      </div>

      <div id="config-warning" class="banner-error hidden"></div>

      <form id="auth-form" class="auth-form" autocomplete="on">
        <div class="field-group">
          <label for="auth-password">专属访问密码</label>
          <input
            id="auth-password"
            name="password"
            type="password"
            placeholder="请输入你的专属密码"
            autocomplete="current-password"
            required
          />
        </div>

        <div id="auth-error" class="banner-error hidden" role="alert"></div>

        <button type="submit" id="auth-submit-btn" class="primary-btn">
          进入对话
        </button>
      </form>
    </section>
  </main>

  <!-- 主聊天视图 -->
  <div id="app-view" class="app-view hidden">
    <header class="top-navbar">
      <div class="nav-left">
        <button type="button" id="history-drawer-btn" class="icon-btn" title="历史对话列表" aria-label="历史对话列表">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="15" y2="18"></line>
          </svg>
        </button>
        <span class="starburst-icon"></span>
        <span class="nav-title">星芒 AI</span>
        <span id="nav-user-pill" class="nav-user-pill" title="当前登录成员"></span>
      </div>
      <div class="nav-actions">
        <button type="button" id="new-chat-btn" class="icon-btn" title="新建对话" aria-label="新建对话">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button type="button" id="theme-toggle-btn" class="icon-btn" title="切换浅色/深色模式" aria-label="切换主题">
          <span id="theme-icon">☀️</span>
        </button>
        <button type="button" id="clear-btn" class="icon-btn" title="清空当前对话" aria-label="清空当前对话">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
          </svg>
        </button>
        <button type="button" id="admin-btn" class="icon-btn hidden" title="管理员后台（切换模型 / 管理成员）" aria-label="管理员后台">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button type="button" id="logout-btn" class="icon-btn" title="退出登录" aria-label="退出登录">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <main id="chat-scroll-area" class="chat-scroll-area">
      <div id="chat-stage" class="chat-stage">
        <div id="welcome-hero" class="welcome-hero hidden">
          <div class="welcome-badge">
            <span class="starburst-icon"></span>
          </div>
          <h1 class="welcome-title">嗨，今天想聊点什么？</h1>
          <p class="welcome-subtitle">日常聊天、随手提问，或者直接发张照片让我看看</p>
        </div>

        <div id="messages-list" class="messages-list"></div>

        <div id="chat-error-box" class="chat-error-box hidden">
          <div id="chat-error-text" class="banner-error"></div>
          <button type="button" id="retry-btn" class="glass-action-btn hidden">
            ↻ 重试生成
          </button>
        </div>
      </div>
    </main>

    <!-- 回到底部圆形毛玻璃按钮 -->
    <button type="button" id="scroll-bottom-btn" class="scroll-bottom-btn" title="回到底部" aria-label="回到底部">
      ↓
    </button>

    <!-- 底部悬浮圆角胶囊输入框 -->
    <div class="composer-dock">
      <div class="composer-wrap">
        <div id="image-preview-bar" class="image-preview-bar hidden">
          <div class="image-chip">
            <img id="image-preview-thumb" alt="待发送图片预览" />
            <span id="image-preview-name" class="image-chip-name"></span>
            <button type="button" id="image-remove-btn" class="image-chip-remove" title="移除图片" aria-label="移除图片">×</button>
          </div>
        </div>

        <form id="composer-form" class="composer-capsule">
          <input
            id="image-file-input"
            type="file"
            accept="image/png,image/jpeg,image/webp"
            class="hidden"
          />
          <button type="button" id="attach-btn" class="attach-btn" title="上传图片（PNG / JPG / WebP）" aria-label="上传图片">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>

          <textarea
            id="prompt-input"
            rows="1"
            maxlength="12000"
            placeholder="说点什么，或点左侧回形针发张图片..."
          ></textarea>

          <span id="char-counter" class="char-counter hidden">0/12000</span>

          <button type="submit" id="send-btn" class="send-btn" title="发送" aria-label="发送">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- 历史对话列表抽屉（按需展开） -->
  <div id="drawer-backdrop" class="drawer-backdrop hidden">
    <aside class="glass-card history-drawer" aria-label="历史对话">
      <div class="drawer-header">
        <span class="drawer-title">我的云端对话</span>
        <button type="button" id="drawer-close-btn" class="icon-btn drawer-close-btn" aria-label="关闭">×</button>
      </div>
      <button type="button" id="drawer-new-chat-btn" class="primary-btn drawer-new-btn">
        ＋ 新建对话
      </button>
      <div id="conversations-list" class="conversations-list"></div>
    </aside>
  </div>

  <!-- 管理员后台弹窗（仅管理员可见） -->
  <div id="admin-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="admin-title">
    <div class="glass-card admin-card">
      <div class="admin-header">
        <div>
          <h2 id="admin-title" class="admin-title">⚙️ 管理员后台</h2>
          <p class="admin-subtitle">全站即时生效 · 支持在 DeepSeek V4.1 Flash 与 Gemini 4 之间自由切换</p>
        </div>
        <button type="button" id="admin-close-btn" class="icon-btn" aria-label="关闭后台">×</button>
      </div>

      <div class="admin-tabs">
        <button type="button" class="admin-tab active" data-tab="models">模型与密钥</button>
        <button type="button" class="admin-tab" data-tab="users">成员密码管理</button>
      </div>

      <!-- Tab 1: 模型与密钥 -->
      <div id="admin-tab-models" class="admin-panel">
        <div class="admin-section-label">快捷切换主力模型</div>
        <div id="preset-grid" class="preset-grid"></div>

        <div class="admin-form-grid">
          <div class="field-group">
            <label for="adm-provider">模型提供方</label>
            <select id="adm-provider" class="glass-select">
              <option value="gemini">Google Gemini</option>
              <option value="deepseek">DeepSeek 官方</option>
              <option value="custom">自定义 OpenAI 兼容</option>
            </select>
          </div>
          <div class="field-group">
            <label for="adm-model">模型 ID</label>
            <input id="adm-model" type="text" placeholder="例如 deepseek-flash 或 gemini-4-hydrogen" />
          </div>
          <div class="field-group field-span-2">
            <label for="adm-base-url">API Base URL</label>
            <input id="adm-base-url" type="text" placeholder="https://api.deepseek.com/" />
          </div>
          <div class="field-group">
            <label for="adm-effort">思考深度</label>
            <select id="adm-effort" class="glass-select">
              <option value="low">low（低 · 推荐日常）</option>
              <option value="medium">medium（中）</option>
              <option value="high">high（高）</option>
              <option value="none">none（关闭，仅 DeepSeek 支持）</option>
            </select>
          </div>
          <div class="field-group">
            <label for="adm-fallback">503 备选模型（可留空）</label>
            <input id="adm-fallback" type="text" placeholder="如 gemini-3.8-flash" />
          </div>
          <div class="field-group field-span-2">
            <label for="adm-deepseek-key">
              DeepSeek API Key <span id="adm-deepseek-status" class="key-badge"></span>
            </label>
            <input id="adm-deepseek-key" type="password" placeholder="留空保持现有 Key 不变；填入新 Key 则覆盖保存" autocomplete="off" />
          </div>
          <div class="field-group field-span-2">
            <label for="adm-gemini-key">
              Gemini API Key <span id="adm-gemini-status" class="key-badge"></span>
            </label>
            <input id="adm-gemini-key" type="password" placeholder="留空保持现有 Key 不变；填入新 Key 则覆盖保存" autocomplete="off" />
          </div>
          <div id="adm-custom-key-group" class="field-group field-span-2 hidden">
            <label for="adm-custom-key">
              自定义接口 API Key <span id="adm-custom-status" class="key-badge"></span>
            </label>
            <input id="adm-custom-key" type="password" placeholder="留空则沿用以上已配 Key" autocomplete="off" />
          </div>
        </div>

        <div id="adm-model-msg" class="admin-msg hidden"></div>

        <div class="admin-footer">
          <button type="button" id="adm-test-btn" class="glass-action-btn admin-btn-lg">测试连通性</button>
          <button type="button" id="adm-save-btn" class="primary-btn admin-save-btn">保存并立即生效</button>
        </div>
      </div>

      <!-- Tab 2: 成员密码管理 -->
      <div id="admin-tab-users" class="admin-panel hidden">
        <div class="admin-section-label">当前成员列表（最多 10 人，各自记录严格隔离）</div>
        <div id="adm-users-list" class="adm-users-list"></div>

        <form id="adm-add-user-form" class="adm-add-user-form">
          <input id="adm-new-uid" type="text" maxlength="24" placeholder="成员昵称（如：小红）" required />
          <input id="adm-new-pwd" type="password" minlength="4" maxlength="128" placeholder="专属密码（至少 4 位）" required />
          <button type="submit" class="primary-btn adm-add-btn">添加 / 改密</button>
        </form>
        <div id="adm-user-msg" class="admin-msg hidden"></div>
      </div>
    </div>
  </div>

  <!-- 轻量化清空确认弹窗 -->
  <div id="confirm-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="glass-card confirm-card">
      <h2 id="confirm-title" class="confirm-title">清空当前对话？</h2>
      <p class="confirm-desc">这会永久删除当前这一条对话里的云端聊天记录与图片，且无法恢复。</p>
      <div class="confirm-actions">
        <button type="button" id="confirm-cancel-btn" class="glass-action-btn">取消</button>
        <button type="button" id="confirm-ok-btn" class="danger-btn">确认清空</button>
      </div>
    </div>
  </div>

  <!-- 图片放大预览层 -->
  <div id="lightbox-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <img id="lightbox-img" class="lightbox-img" alt="图片大图预览" />
  </div>

  <script src="/markdown.js"></script>
  <script src="/app.js"></script>
</body>
</html>
